[package]
name = "adnt"
version = "0.1.0"
edition = "2021"
description = "Dynamic CLI tool manager for ADNT projects - auto-discovers, installs, and manages tools from ADNTIO"
authors = ["ADNT Sàrl <info@adnt.io>"]
license = "GPL-3.0"
repository = "https://github.com/ADNTIO/adnt"
keywords = ["cli", "tool-manager", "adnt", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["macros", "rt", "process", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1.0"
colored = "3.1"
indicatif = "0.18"
dirs = "7.0"
chrono = "0.4"
reqwest = { version = "0.13", features = ["json", "form"] }
open = "5.4"
base64 = "0.23"
serde_norway = "0.9"
which = "8"

[dev-dependencies]
tempfile = "3.27"

[[bin]]
name = "adnt"
path = "src/main.rs"
